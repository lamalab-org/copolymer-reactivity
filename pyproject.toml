# See https://setuptools.readthedocs.io/en/latest/build_meta.html
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copolymer-reactivity"
version = "0.1.0"
requires-python = ">=3.8"
# Core deps needed for inference-only use of `copolpredictor` (i.e. the API).
# Heavier training/visualization/extraction stacks live in optional extras.
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "joblib",
    "rdkit",
    "requests",
]

[project.optional-dependencies]
# Plotting / evaluation stack: only needed for training notebooks and
# experiment scripts, not for inference.
training = [
    "matplotlib",
    "pyyaml",
]
# Heavy data-extraction / LLM stack: only needed for the offline pipelines
# under data_extraction/ and src/copolextractor/, NOT for the API.
extraction = [
    "openai",
    "anthropic",
    "crossrefapi",
    "doi2pdf",
    "pdf2image",
    "pytesseract",
    "opencv-python",
    "Pillow",
    "imutils",
    "selenium",
    "beautifulsoup4",
    "thefuzz",
    "pint",
    "pubchempy",
    "diskcache",
    "backoff",
    "pyyaml",
]
testing = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
reverse_relative = true
