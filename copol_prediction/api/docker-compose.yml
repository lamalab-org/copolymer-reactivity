version: '3.8'

services:
  api:
    build:
      context: ../
      dockerfile: api/Dockerfile
    container_name: copol-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/artifacts/model_bundle
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount artifacts directory for model updates without rebuild
      - ../artifacts:/app/artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - copol-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: copol-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # For HTTPS, mount SSL certificates:
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - copol-network

networks:
  copol-network:
    driver: bridge

